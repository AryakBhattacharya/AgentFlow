
# AgentFlow local infrastructure
# FastAPI and Celery will run directly from the Python virtual environment.

services:
  postgres:
    image: postgres:17-alpine
    container_name: agentflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentflow

    ports:
    - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow -d agentflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Persistent storage for PostgreSQL and Redis.
volumes:
  postgres_data:
  redis_data:
